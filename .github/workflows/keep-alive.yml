name: 24/7 Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -f -s https://luki-management.onrender.com/api/health || true
